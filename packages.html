<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gifts &amp; Corporate | PLAY</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw-config.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans">
<div id="app-header"></div>
<main class="max-w-7xl mx-auto px-5 pt-14">
  <div class="text-center max-w-2xl mx-auto mb-14">
    <h1 class="font-serif text-5xl mb-4" data-i18n="pkg_title"></h1>
    <p class="text-stone" data-i18n="pkg_text"></p>
  </div>
  <div id="pkgs"></div>

  <section id="quote" class="max-w-2xl mx-auto mt-24 scroll-mt-24">
    <h2 class="font-serif text-3xl text-center mb-8" data-i18n="request_quote"></h2>
    <form id="form" class="grid gap-4">
      <input id="hp" class="hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
      <select id="pkg" class="field"></select>
      <input id="company" class="field" data-i18n-ph="company">
      <input id="cname" class="field" data-i18n-ph="name" required>
      <div class="grid md:grid-cols-2 gap-4">
        <input id="email" type="email" class="field" data-i18n-ph="email">
        <input id="phone" class="field" data-i18n-ph="phone" required>
      </div>
      <input id="qtyIn" type="number" min="1" class="field" data-i18n-ph="quantity">
      <textarea id="notes" rows="4" class="field" data-i18n-ph="notes"></textarea>
      <button class="btn btn-solid" data-i18n="send"></button>
    </form>
    <div id="reqDone" class="hidden text-center py-6"></div>
  </section>
</main>
<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let pkgList = [];
function pkgCard(k) {
  const img = k.image_url ? `<img src="${PLAY.esc(k.image_url)}" alt="">` : `<div class="ph w-full h-full">${PLAY.esc(PLAY.pick(k, 'name'))}</div>`;
  return `<div class="card">
    <div class="card-img" style="aspect-ratio:4/3">${img}</div>
    <div class="pt-4 text-center">
      <h3 class="font-serif text-2xl">${PLAY.esc(PLAY.pick(k, 'name'))}</h3>
      <p class="text-sm text-stone mt-2 mb-3">${PLAY.esc(PLAY.pick(k, 'desc'))}</p>
      <p class="text-sm">${PLAY.t('from')} ${PLAY.money(k.price_from_egp || 0)}${k.min_qty > 1 ? ` &middot; ${PLAY.t('min_order')}: ${k.min_qty}` : ''}</p>
      <button class="btn mt-4" data-pick="${k.id}">${PLAY.t('request_quote')}</button>
    </div></div>`;
}
PLAY.page(async () => {
  pkgList = await PLAY_DATA.packages();
  const section = (kind, title) => {
    const items = pkgList.filter(k => k.kind === kind);
    return items.length ? `<h2 class="font-serif text-3xl mb-8 mt-14">${PLAY.t(title)}</h2><div class="grid md:grid-cols-3 gap-8">${items.map(pkgCard).join('')}</div>` : '';
  };
  document.getElementById('pkgs').innerHTML = section('gift', 'gift_pkg') + section('corporate', 'corp_pkg');
  const sel = document.getElementById('pkg');
  const cur = sel.value;
  sel.innerHTML = pkgList.map(k => `<option value="${k.id}">${PLAY.esc(PLAY.pick(k, 'name'))}</option>`).join('');
  if (cur) sel.value = cur;
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    sel.value = b.dataset.pick; document.getElementById('quote').scrollIntoView({ behavior: 'smooth' });
  });
});
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (document.getElementById('hp').value) return;
  const v = id => document.getElementById(id).value.trim();
  if (!v('cname') || !v('phone')) return PLAY.toast(PLAY.t('required'));
  if (!PLAY.throttle()) return PLAY.toast(PLAY.t('wait'));
  const k = pkgList.find(x => String(x.id) === v('pkg'));
  const id = PLAY.uuid(), ref = PLAY.ref(id);
  const row = { id, package_id: k ? String(k.id) : null, package_name: k ? k.name_en : null, company: v('company'), contact_name: v('cname'), email: v('email'), phone: v('phone'), quantity: parseInt(v('qtyIn')) || null, notes: v('notes') };
  const btn = e.target.querySelector('button.btn-solid'); btn.disabled = true;
  const r = await PLAY.save('package_requests', row);
  btn.disabled = false;
  const ok = !r.skipped && !r.error;
  const text = `PLAY quote request ${ref}: ${row.package_name || ''}\n${row.company}\n${row.contact_name} ${row.phone} ${row.email}\nQty: ${row.quantity || ''}\n${row.notes}`;
  e.target.classList.add('hidden');
  const el = document.getElementById('reqDone'); el.classList.remove('hidden');
  el.innerHTML = `<h3 class="font-serif text-3xl mb-3">${PLAY.t(ok ? 'req_thanks' : 'almost')}</h3>
    <p class="eyebrow mb-1">${PLAY.t('order_ref')}</p><p class="font-serif text-2xl mb-4">${PLAY.esc(ref)}</p>
    <p class="text-stone mb-6">${PLAY.t(ok ? 'req_next' : (r.error ? 'save_failed' : 'wa_complete'))}</p>
    <a href="${PLAY.whatsapp(text)}" target="_blank" rel="noopener" class="btn ${ok ? '' : 'btn-solid'}">${PLAY.t(ok ? 'wa_chat' : 'wa_send')}</a>`;
  if (ok) e.target.reset();
});
</script>
</body>
</html>
