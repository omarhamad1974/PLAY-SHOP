<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart | PLAY</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tw-config.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans">
<div id="app-header"></div>
<main class="max-w-6xl mx-auto px-5 pt-14">
  <h1 id="h1" class="font-serif text-4xl text-center mb-10" data-i18n="your_cart"></h1>
  <div id="done" class="hidden text-center max-w-lg mx-auto py-10"></div>
  <p id="empty" class="hidden text-center text-stone py-16"><span data-i18n="empty_cart"></span><br><a href="products.html" class="link-u mt-3 inline-block" data-i18n="shop_all"></a></p>
  <div id="content" class="grid md:grid-cols-5 gap-12">
    <div class="md:col-span-3"><div id="items" class="divide-y divide-line border-y border-line"></div>
      <div class="flex justify-between text-lg py-5"><span data-i18n="total"></span><span id="total" class="font-medium"></span></div>
    </div>
    <form id="form" class="md:col-span-2 grid gap-3 content-start">
      <h2 class="font-serif text-2xl mb-2" data-i18n="checkout"></h2>
      <input id="hp" class="hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input id="cname" class="field" data-i18n-ph="name" required>
      <input id="phone" class="field" data-i18n-ph="phone" required>
      <input id="email" type="email" class="field" data-i18n-ph="email">
      <input id="address" class="field" data-i18n-ph="address" required>
      <div class="grid grid-cols-2 gap-3"><input id="city" class="field" data-i18n-ph="city"><input id="country" class="field" data-i18n-ph="country" value="Egypt"></div>
      <textarea id="notes" rows="3" class="field" data-i18n-ph="notes"></textarea>
      <div class="bg-sand p-4 text-sm"><p class="font-medium mb-1" data-i18n="payment"></p><p data-i18n="pay_manual" class="mb-1"></p><p id="payNote" class="text-stone"></p></div>
      <button class="btn btn-solid" data-i18n="place_order"></button>
      <a id="wa" target="_blank" rel="noopener" class="text-center text-sm link-u self-center" data-i18n="wa_order"></a>
    </form>
  </div>
</main>
<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
const total = c => c.reduce((s, i) => s + i.price * i.qty, 0);
function orderText(c) {
  return 'PLAY order:\n' + c.map(i => `${i.qty} x ${i.name_en} (EGP ${i.price})`).join('\n') + `\nTotal: EGP ${total(c)}`;
}
let done = null;
function showDone() {
  ['empty', 'content', 'h1'].forEach(i => document.getElementById(i).classList.add('hidden'));
  const el = document.getElementById('done'); el.classList.remove('hidden');
  const ok = done.saved;
  el.innerHTML = `<h2 class="font-serif text-4xl mb-4">${PLAY.t(ok ? 'order_thanks' : 'almost')}</h2>
    <p class="eyebrow mb-1">${PLAY.t('order_ref')}</p><p class="font-serif text-3xl mb-6">${PLAY.esc(done.ref)}</p>
    <p class="text-stone mb-8">${PLAY.t(ok ? 'order_next' : (done.failed ? 'save_failed' : 'wa_complete'))}</p>
    <a href="${PLAY.whatsapp(done.text)}" target="_blank" rel="noopener" class="btn btn-solid">${PLAY.t(ok ? 'send_receipt' : 'wa_send')}</a>
    <div class="mt-6"><a href="${ok ? 'products.html' : '#'}" id="backBtn" class="link-u text-sm">${PLAY.t(ok ? 'continue' : 'back_cart')}</a></div>`;
  if (!ok) document.getElementById('backBtn').onclick = ev => { ev.preventDefault(); done = null; PLAY.refresh(); };
}
PLAY.page(async () => {
  if (done) return showDone();
  document.getElementById('done').classList.add('hidden'); document.getElementById('h1').classList.remove('hidden');
  const c = PLAY.cartGet();
  document.getElementById('empty').classList.toggle('hidden', c.length > 0);
  document.getElementById('content').classList.toggle('hidden', c.length === 0);
  document.getElementById('items').innerHTML = c.map((i, n) => `
    <div class="flex items-center gap-4 py-4">
      <div class="w-20 h-24 shrink-0 card-img">${i.image_url ? `<img src="${PLAY.esc(i.image_url)}" alt="">` : `<div class="ph w-full h-full" style="font-size:.7rem"></div>`}</div>
      <div class="flex-1"><a href="product.html?slug=${encodeURIComponent(i.slug)}" class="font-serif text-lg">${PLAY.esc(PLAY.pick(i, 'name'))}</a>
        <p class="text-sm text-stone">${PLAY.money(i.price)}</p>
        <div class="flex items-center gap-3 mt-2 text-sm">
          <button data-d="-1" data-n="${n}" class="border border-line w-7 h-7">-</button><span>${i.qty}</span><button data-d="1" data-n="${n}" class="border border-line w-7 h-7">+</button>
          <button data-rm="${n}" class="text-stone link-u ms-3">${PLAY.t('remove')}</button></div></div>
      <div class="text-sm">${PLAY.money(i.price * i.qty)}</div></div>`).join('');
  document.getElementById('total').textContent = PLAY.money(total(c));
  document.getElementById('payNote').textContent = PLAY.lang === 'ar' ? PLAY_CONFIG.PAYMENT_NOTE_AR : PLAY_CONFIG.PAYMENT_NOTE_EN;
  document.getElementById('wa').href = PLAY.whatsapp(orderText(c));
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const cart = PLAY.cartGet(); cart[b.dataset.n].qty = Math.max(1, cart[b.dataset.n].qty + parseInt(b.dataset.d)); PLAY.cartSet(cart); PLAY.refresh();
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const cart = PLAY.cartGet(); cart.splice(b.dataset.rm, 1); PLAY.cartSet(cart); PLAY.refresh();
  });
});
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (document.getElementById('hp').value) return; // honeypot: bots fill hidden fields
  const c = PLAY.cartGet(); const v = id => document.getElementById(id).value.trim();
  if (!c.length || !v('cname') || !v('phone') || !v('address')) return PLAY.toast(PLAY.t('required'));
  if (!PLAY.throttle()) return PLAY.toast(PLAY.t('wait'));
  const id = PLAY.uuid(), ref = PLAY.ref(id);
  const row = {
    id, customer_name: v('cname'), phone: v('phone'), email: v('email'), address: v('address'), city: v('city'), country: v('country'),
    payment_method: 'manual', notes: v('notes'), currency: PLAY.cur, total_egp: total(c),
    items: c.map(i => ({ id: i.id, name: i.name_en, qty: i.qty, price: i.price }))
  };
  const btn = e.target.querySelector('button.btn-solid'); btn.disabled = true;
  const r = await PLAY.save('orders', row);
  btn.disabled = false;
  const saved = !r.skipped && !r.error;
  const full = `PLAY order ${ref}\n` + orderText(c).replace('PLAY order:\n', '') + `\n${row.customer_name} ${row.phone} ${row.email}\n${row.address}, ${row.city}, ${row.country}\n${row.notes}`;
  done = { saved, failed: !!r.error, ref, text: saved ? `Hello PLAY, my order ${ref}. Payment receipt attached.` : full };
  if (saved) PLAY.cartSet([]);
  PLAY.refresh();
});
</script>
</body>
</html>
